name: Modpack

on:
  push:
    paths:
      - 'pack/**'
      - 'werkzeuge/pack.py'
      - 'werkzeuge/servertest.py'
      - 'src/**'
      - '.github/workflows/modpack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modpack:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: packwiz installieren
        run: go install github.com/packwiz/packwiz@latest && echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Unsere Mod bauen
        run: chmod +x ./gradlew && ./gradlew build

      - name: Modpack bauen
        run: python3 werkzeuge/pack.py bauen

      - name: Pack als Download bereitstellen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: modpack
          name: Deadzone MC – Modpack (CurseForge)
          body: |
            In der CurseForge-App: Minecraft → „Benutzerdefiniertes Profil erstellen“ → „Importieren“
            und die Datei `deadzone-mc-modpack.zip` auswählen.
          files: build/deadzone-mc-modpack.zip

      - name: Testserver mit dem ganzen Pack einrichten
        run: python3 werkzeuge/pack.py server

      - name: Testwelt erzeugen
        env:
          TEST_ORDNER: build/server
          TEST_BEFEHL: ./run.sh nogui
          TEST_FRIST_MIN: '25'
          TEST_ALLE_FEHLER: '1'
        run: python3 werkzeuge/servertest.py

      - name: Infos aus Mods (Beutetabellen, Waffen)
        if: always()
        run: |
          cd build/server/mods
          lc=$(ls | grep -i lost | head -1); tz=$(ls | grep -i tacz | head -1)
          unzip -l "$lc" | grep -E "loot_table|lootTables|loot" | awk '{print $4}' | head -60 > /tmp/lc.txt || true
          unzip -p "$lc" data/lostcities/lostcities/conditions/chestloot.json > /tmp/lc.txt || true
          unzip -l "$lc" | grep -E "lostcities/lostcities/(buildings|multibuildings|citystyles|worldstyles)/" | awk '{print $4}' | sed 's|data/lostcities/lostcities/||' | tr '\n' ' ' >> /tmp/lc.txt || true
          mkdir -p /tmp/tzk && cd /tmp/tzk && unzip -q -o "$OLDPWD/$tz" 'com/*' 2>/dev/null; cd "$OLDPWD"
          grep -rhoa -E "Gun(Id|FireMode|CurrentAmmoCount)|Ammo(Id)?Count|AmmoId|tacz:[a-z_]+" /tmp/tzk 2>/dev/null | sort | uniq -c | sort -rn | head -60 > /tmp/tz.txt || true
          unzip -p "$tz" assets/tacz/custom/tacz_default_gun/data/tacz/data/guns/glock_17_data.json | head -c 1200 >> /tmp/tz.txt || true
          python3 -c "import sys; [print('::notice title='+t+'::'+open(f).read()[:3800].replace(chr(10),'%0A')) for t,f in (('Lost Cities Beute','/tmp/lc.txt'),('TaCZ Inhalt','/tmp/tz.txt'))]"
          ls ../config | head -80 | tr '\n' ' '

      - name: Configs Lost Cities
        if: always()
        run: python3 werkzeuge/configs_zeigen.py build/server 'config/lostcities/profiles/default.json' 'config/lostcities/profiles/wasteland.json'

      - name: Configs Survival
        if: always()
        run: python3 werkzeuge/configs_zeigen.py build/server 'config/toughasnails/*' 'config/toughasnails*' 'config/sereneseasons/*'

      - name: Configs Gegner
        if: always()
        run: |
          python3 werkzeuge/configs_zeigen.py build/server 'config/improvedmobs/*' 'config/enhancedcelestials/*' 'config/improvedmobs*'
          ls build/server/config | head -100
