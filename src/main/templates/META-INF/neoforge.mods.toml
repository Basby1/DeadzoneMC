modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Horror-Survival in einer postapokalyptischen Welt voller Nebel. Plündern, überleben, die Basis ausbauen –
und herausfinden, was in Station Null geschehen ist.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.7,)"
    ordering="NONE"
    side="BOTH"

# Nach Lost Cities laden, damit unsere Beuteregeln für die Städte gelten
[[dependencies.${mod_id}]]
    modId="lostcities"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
